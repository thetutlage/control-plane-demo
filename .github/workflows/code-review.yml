name: Code review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Flow and the reviewer
        run: |
          mkdir -p "$RUNNER_TEMP/tools" node_modules/.bin
          cd "$RUNNER_TEMP/tools" && npm init -y > /dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/vendor/review/*.tgz
          ln -s "$RUNNER_TEMP"/tools/node_modules/.bin/* "$GITHUB_WORKSPACE/node_modules/.bin/"

      - run: npx flow install --ci

      - name: Review
        run: npx flow-reviewer run ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} --post --pr=${{ github.event.pull_request.number }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
